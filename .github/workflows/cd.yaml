name: CD Pipeline - Production Deployment

on:
  push:
    branches:
      - prod

env:
  IMAGE_NAME: intranet-newdeal
  IMAGE_TAG: prod

jobs:
  # JOB 1 : Scan de sécurité bloquant
  security_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Run Trivy filesystem scan for CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Scan for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: HEAD
          extra_args: --only-verified

  # JOB 2 : Déploiement sur runner_prod avec port 80
  deploy_production:
    needs: security_scan
    runs-on: [self-hosted, runner_prod]
    steps:
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pull latest production image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Stop and remove existing container
        run: |
          docker rm -f intranet-newdeal-prod || true

      - name: Start production container on port 80
        run: |
          docker run -d \
            --name intranet-newdeal-prod \
            --restart unless-stopped \
            -p 80:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify container is running
        run: |
          sleep 3
          docker ps | grep intranet-newdeal-prod || exit 1

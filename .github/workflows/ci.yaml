name: CI-CD Docker Pipeline

on:
  push:
    branches:
      - dev  # Changé main -> dev pour que ça détecte ton travail

env:
  IMAGE_NAME: intranet-newdeal
  IMAGE_TAG: dev
  DOCKER_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # JOB 1 : Construction et Push vers Docker Hub
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: |
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  # JOB 2 : Simulation de déploiement (sur serveur GitHub)
  deploy:
    needs: ci
    runs-on: ubuntu-latest # Changé runner-lab -> ubuntu-latest
    steps:
      - name: Pull image from Docker Hub
        run: |
          echo "Déploiement en cours de l'image ${{ env.IMAGE_NAME }}..."
